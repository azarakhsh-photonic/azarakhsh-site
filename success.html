<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت موفق | آذرخش فوتونیک</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] } } }
        }
    </script>

    <style>
        body {
            background-color: #060913;
            color: #f8fafc;
            overflow: hidden;
        }
        .glass {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        .logo-mask {
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 55%, rgba(0,0,0,0) 95%);
            mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 55%, rgba(0,0,0,0) 95%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <canvas id="photonCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-60"></canvas>

    <div class="relative z-10 glass rounded-3xl p-8 sm:p-10 max-w-lg w-full text-center border-t-4 border-t-emerald-400 shadow-[0_0_50px_rgba(16,185,129,0.2)]">
        
        <img src="logo.jpg" alt="آذرخش فوتونیک" class="w-44 h-auto mx-auto mb-4 block logo-mask">

        <div class="w-16 h-16 rounded-full bg-emerald-500/15 border border-emerald-400/40 flex items-center justify-center mx-auto mb-5 text-emerald-400 shadow-[0_0_25px_rgba(16,185,129,0.3)]">
            <i data-lucide="check-circle-2" class="w-9 h-9"></i>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black text-emerald-400 mb-4">ثبت موفق اطلاعات</h1>
        
        <p class="text-slate-300 text-sm sm:text-base leading-loose mb-8">
            دانشجوی گرامی، مشخصات و رزومه شما با موفقیت در سیستم <strong class="text-white">آذرخش فوتونیک</strong> ثبت گردید.<br>
            کارشناسان ما پس از بررسی‌های اولیه، در اسرع وقت با شما تماس خواهند گرفت.
        </p>

        <a href="https://azarakhshphotonic.ir" class="inline-flex items-center justify-center gap-2 w-full sm:w-auto px-8 py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-base shadow-[0_4px_20px_rgba(79,70,229,0.4)] hover:-translate-y-0.5 transition">
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
            <span>بازگشت به صفحه اصلی</span>
        </a>
    </div>

    <script>
        lucide.createIcons();

        const pCanvas = document.getElementById('photonCanvas');
        const pCtx = pCanvas.getContext('2d');
        pCanvas.width = window.innerWidth;
        pCanvas.height = window.innerHeight;
        let particles = [];
        for (let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * pCanvas.width,
                y: Math.random() * pCanvas.height,
                vx: (Math.random() - 0.5) * 0.7,
                vy: (Math.random() - 0.5) * 0.7,
                r: Math.random() * 2 + 1,
                c: ['#10b981', '#38bdf8'][Math.floor(Math.random() * 2)]
            });
        }
        function animateBg() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > pCanvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > pCanvas.height) p.vy *= -1;
                pCtx.beginPath(); pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                pCtx.fillStyle = p.c; pCtx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();
    </script>
</body>
</html>
