<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت موفق | آذرخش فوتونیک</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #131a26;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #10b981; /* نوار سبز رنگ موفقیت */
            max-width: 500px;
            width: 90%;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 55%, rgba(0,0,0,0) 95%);
            mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 55%, rgba(0,0,0,0) 95%);
        }
        h1 {
            color: #10b981;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .btn-back {
            background: linear-gradient(135deg, #1e40af, #4f46e5);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #2563eb, #6366f1);
            box-shadow: 0 4px 25px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- فراخوانی همان لوگوی اصلی سایت -->
        <img src="logo.jpg" alt="آذرخش فوتونیک" class="logo">
        
        <h1>ثبت موفق اطلاعات</h1>
        <p>دانشجوی گرامی، مشخصات و رزومه شما با موفقیت در سیستم ثبت گردید.<br>کارشناسان ما پس از بررسی‌های اولیه، در اسرع وقت با شما تماس خواهند گرفت.</p>
        
        <a href="https://azarakhshphotonic.ir" class="btn-back">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
