<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آذرخش فوتونیک | در حال آماده‌سازی</title>
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #8b949e;
        }
        .spinner {
            margin: 30px auto;
            width: 45px; 
            height: 45px;
            border: 4px solid rgba(88, 166, 255, 0.1);
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>آذرخش فوتونیک</h1>
        <div class="spinner"></div>
        <p>زیرساخت سایت در حال به‌روزرسانی است.<br>به‌زودی با خدماتی کامل در حوزه فوتونیک برمی‌گردیم.</p>
    </div>
</body>
</html>
