<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون کار و فناوری هفتم | پودمان ۱</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, 'B Nazanin', sans-serif;
            background: linear-gradient(135deg, #122a4a 0%, #186078 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            color: #122a4a;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            max-width: 460px;
            width: 90%;
            text-align: center;
            box-sizing: border-box;
        }
        .tag {
            background-color: #e6f4f6;
            color: #0a828c;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 20px;
            color: #122a4a;
            margin: 0 0 10px 0;
        }
        .author {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .rules {
            background-color: #f7fafc;
            border: 1px dashed #cbd5e0;
            border-radius: 10px;
            padding: 15px;
            font-size: 13.5px;
            line-height: 1.8;
            color: #333;
            text-align: right;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            background-color: #0a828c;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(10, 130, 140, 0.4);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #086971;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="tag">سامانه هوشمند ارزیابی برخط</span>
        <h2>آزمون کار و فناوری پایه هفتم</h2>
        <div class="author">پودمان ۱: نوآوری و فناوری $|$ دبیر: محمدحسن پورصالحی</div>

        <div class="rules">
            🔹 <strong>بخش اول:</strong> سوالات چهارگزینه‌ای (تستی)<br>
            🔹 <strong>بخش دوم:</strong> سوالات تحلیلی و تشریحی<br>
            ✍️ <strong>شیوه پاسخ تشریحی:</strong> امکان تایپ مستقیم در گوشی یا نوشتن روی برگه و ارسال عکس دست‌نویس فراهم است.
        </div>

        <a class="btn" href="https://digiform.ir/wbca3cbf1e">ورود به صفحه آزمون</a>
    </div>

</body>
</html>
